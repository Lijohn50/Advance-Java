<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${isEdit} ? 'Edit Tool — DevTrack' : 'Add Tool — DevTrack'">Tool — DevTrack</title>
  <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>

<!--<div th:replace="~{fragments/layout :: shell(${isEdit} ? 'Edit Tool' : 'Add Tool', 'tools', ~{::section})}"></div>-->

<section>
  <div class="form-page-center">
  <div class="panel panel-padded" style="max-width: 680px; width:100%;">
    <form th:action="@{/tools}"
          th:object="${tool}" method="post" novalidate>

      <div class="form-grid">
        <div class="field-group full">
          <label class="field-label" for="name">TOOL NAME</label>
          <input type="text" id="name" class="field-input" th:field="*{name}" placeholder="GitHub Copilot">
          <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <!--<div class="field-group">
          <label class="field-label" for="category">CATEGORY</label>
          <select id="category" class="field-select" th:field="*{category}">
            <option value="" disabled>Choose&hellip;</option>
            <option th:each="c : ${categories}" th:value="${c}" th:text="${c}">CATEGORY</option>
          </select>
          <div class="field-error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
        </div>-->

        <div class="field-group">
          <label class="field-label" for="vendor">VENDOR</label>
          <input type="text" id="vendor" class="field-input" th:field="*{vendor}" placeholder="GitHub">
          <div class="field-error" th:if="${#fields.hasErrors('vendor')}" th:errors="*{vendor}"></div>
        </div>

        <!--<div class="field-group">
          <label class="field-label" for="licenseType">LICENSE TYPE</label>
          <select id="licenseType" class="field-select" th:field="*{licenseType}">
            <option value="" disabled>Choose&hellip;</option>
            <option th:each="lt : ${licenseTypes}" th:value="${lt}" th:text="${lt}">LICENSE</option>
          </select>
          <div class="field-error" th:if="${#fields.hasErrors('licenseType')}" th:errors="*{licenseType}"></div>
        </div>-->

        <div class="field-group">
          <label class="field-label" for="costPerSeat">COST PER SEAT ($)</label>
          <input type="number" step="0.01" min="0" id="costPerSeat" class="field-input" th:field="*{costPerSeat}" placeholder="19.00">
          <div class="field-error" th:if="${#fields.hasErrors('costPerSeat')}" th:errors="*{costPerSeat}"></div>
        </div>

        <div class="field-group">
          <label class="field-label" for="totalSeats">TOTAL SEATS PURCHASED</label>
          <input type="number" min="0" id="totalSeats" class="field-input" th:field="*{totalSeats}" placeholder="10">
          <div class="field-error" th:if="${#fields.hasErrors('totalSeats')}" th:errors="*{totalSeats}"></div>
        </div>

        <div class="field-group">
          <label class="field-label" for="renewalDate">RENEWAL DATE</label>
          <input type="date" id="renewalDate" class="field-input" th:field="*{renewalDate}">
          <div class="field-error" th:if="${#fields.hasErrors('renewalDate')}" th:errors="*{renewalDate}"></div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save</button>
          <a th:href="@{/tools}" class="btn btn-secondary">Cancel</a>
        </div>
      </div>
    </form>
    </div>
  </div>
</section>

</body>
</html>
