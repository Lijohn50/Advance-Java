<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Aurora Login</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a0a16;
            overflow: hidden;
            position: relative;
        }

        /* Animated Aurora Glow Background */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.4;
            z-index: 1;
            animation: float 12s infinite alternate ease-in-out;
        }

        body::before {
            background: radial-gradient(circle, #4f46e5, #06b6d4);
            top: -10%;
            left: -10%;
        }

        body::after {
            background: radial-gradient(circle, #d946ef, #7c3aed);
            bottom: -10%;
            right: -10%;
            animation-delay: -6s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(80px, 50px) scale(1.2); }
        }

        /* Glassmorphism Card Container */
        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header h1 {
            color: #ffffff;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .login-header p {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        /* Input Group Styling */
        .input-group {
            position: relative;
            margin-bottom: 24px;
        }

        .input-group input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            outline: none;
            color: #ffffff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        /* Interactive Floating Labels */
        .input-group label {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        /* Input Focus & Validation states */
        .input-group input:focus,
        .input-group input:not(:placeholder-shown) {
            border-color: #06b6d4;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.2);
        }

        .input-group input:focus ~ label,
        .input-group input:not(:placeholder-shown) ~ label {
            top: 0;
            font-size: 0.75rem;
            padding: 0 6px;
            color: #06b6d4;
            background: #0f1026;
            border-radius: 4px;
        }

        /* Utilities */
        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 0.85rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            color: #94a3b8;
            cursor: pointer;
        }

        .remember-me input {
            margin-right: 8px;
            accent-color: #06b6d4;
        }

        .forgot-pass {
            color: #06b6d4;
            text-decoration: none;
            transition: color 0.2s;
        }

        .forgot-pass:hover {
            color: #22d3ee;
            text-decoration: underline;
        }

        /* Submit Button with Gradient Hover */
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(6, 182, 212, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        /* Footer Link */
        .signup-link {
            text-align: center;
            margin-top: 24px;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .signup-link a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-header">
        <h1>Welcome Back</h1>
        <p>Please enter your details to sign in</p>
    </div>

    <form onsubmit="event.preventDefault();">
        <div class="input-group">
            <input type="email" id="email" placeholder=" " required autocomplete="off">
            <label for="email">Email Address</label>
        </div>

        <div class="input-group">
            <input type="password" id="password" placeholder=" " required>
            <label for="password">Password</label>
        </div>

        <div class="form-actions">
            <label class="remember-me">
                <input type="checkbox"> Remember me
            </label>
            <a href="#" class="forgot-pass">Forgot password?</a>
        </div>

        <button type="submit" class="submit-btn">Sign In</button>

        <div class="signup-link">
            Don't have an account? <a href="#">Sign up</a>
        </div>
    </form>
</div>

</body>
</html>
